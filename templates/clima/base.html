<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clima Paraguay{% endblock %}</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --glass: rgba(255, 255, 255, 0.16);
            --glass-strong: rgba(255, 255, 255, 0.22);
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --danger-bg: rgba(254, 226, 226, 0.95);
            --danger-text: #b91c1c;
            --success-bg: rgba(220, 252, 231, 0.92);
            --success-text: #166534;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
            --shadow-soft: 0 10px 30px rgba(15, 23, 42, 0.12);
            --radius: 24px;
            --radius-sm: 16px;
            --border-soft: 1px solid rgba(255,255,255,0.18);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.3s ease;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            top: -80px;
            left: -80px;
            background: #ffffff;
        }

        body::after {
            bottom: -100px;
            right: -80px;
            background: #93c5fd;
        }

        .bg-sunny {
            background: linear-gradient(135deg, #fbbf24, #f59e0b, #f97316);
        }

        .bg-cloudy {
            background: linear-gradient(135deg, #94a3b8, #64748b, #475569);
        }

        .bg-rainy {
            background: linear-gradient(135deg, #0ea5e9, #2563eb, #1e40af);
        }

        .bg-storm {
            background: linear-gradient(135deg, #334155, #1e293b, #0f172a);
        }

        .bg-mist {
            background: linear-gradient(135deg, #cbd5e1, #94a3b8, #64748b);
        }

        .bg-default {
            background: linear-gradient(135deg, #0ea5e9, #2563eb, #1e3a8a);
        }

        .page-shell {
            position: relative;
            z-index: 1;
        }

        .navbar {
            width: 100%;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: var(--border-soft);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(255,255,255,0.16);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 14px;
            transition: all 0.25s ease;
            font-weight: 700;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-2px);
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 42px auto;
            padding: 0 20px 36px;
        }

        .panel {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            border: var(--border-soft);
            animation: fadeUp 0.45s ease;
        }

        .page-title {
            color: white;
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-shadow: 0 8px 22px rgba(0,0,0,0.14);
        }

        .page-subtitle {
            color: rgba(255,255,255,0.90);
            text-align: center;
            margin: 0 auto 28px auto;
            max-width: 760px;
            line-height: 1.6;
            font-size: 16px;
        }

        .search-form {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .search-form input,
        .search-form select {
            padding: 15px 16px;
            border-radius: 16px;
            border: none;
            width: 320px;
            max-width: 100%;
            outline: none;
            font-size: 15px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .search-form input:focus,
        .search-form select:focus {
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(15, 23, 42, 0.16);
        }

        .btn {
            padding: 14px 20px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-soft);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.28);
        }

        .btn-outline-light {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
        }

        .btn-outline-light:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-2px);
        }

        .alert-error,
        .alert-success {
            padding: 14px 16px;
            border-radius: 14px;
            margin: 18px auto;
            text-align: center;
            max-width: 680px;
            font-weight: 700;
            box-shadow: var(--shadow-soft);
            animation: fadeUp 0.35s ease;
        }

        .alert-error {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .weather-card {
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 28px;
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 24px;
            box-shadow: var(--shadow);
            animation: fadeUp 0.45s ease;
        }

        .weather-left h2 {
            font-size: 32px;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .temp {
            font-size: 58px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin: 10px 0;
        }

        .desc {
            font-size: 18px;
            color: var(--muted);
            text-transform: capitalize;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 6px;
        }

        .mini-box {
            background: #f8fafc;
            border-radius: 18px;
            padding: 16px;
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
            transition: transform 0.2s ease;
        }

        .mini-box:hover {
            transform: translateY(-2px);
        }

        .mini-box .label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .mini-box .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--secondary);
        }

        .weather-right {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .weather-right img {
            width: 170px;
            height: 170px;
            filter: drop-shadow(0 12px 18px rgba(0,0,0,0.14));
            animation: floatIcon 3s ease-in-out infinite;
        }

        .weather-note {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        .table-card {
            overflow: hidden;
            border-radius: 24px;
            background: rgba(255,255,255,0.98);
            box-shadow: var(--shadow);
            animation: fadeUp 0.45s ease;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 15px 12px;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        table td {
            padding: 14px 12px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
            background: rgba(255,255,255,0.98);
        }

        tbody tr:hover td {
            background: #f8fbff;
        }

        .badge-temp {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 800;
        }

        .btn-small {
            padding: 8px 12px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            display: inline-block;
            transition: all 0.22s ease;
        }

        .btn-small:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .btn-view {
            background: #2563eb;
        }

        .btn-fav {
            background: #f59e0b;
        }

        .btn-delete {
            background: #dc2626;
        }

        .actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .stat-card {
            background: rgba(255,255,255,0.97);
            padding: 24px;
            border-radius: 22px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-card h3 {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: 900;
            color: var(--primary-dark);
        }

        .favorite-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .favorite-card {
            background: rgba(255,255,255,0.97);
            padding: 24px;
            border-radius: 22px;
            text-align: center;
            box-shadow: var(--shadow);
            animation: fadeUp 0.35s ease;
        }

        .favorite-card h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .favorite-card .favorite-temp {
            font-size: 36px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .favorite-card .favorite-desc {
            color: var(--muted);
            margin-bottom: 14px;
            text-transform: capitalize;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 20px 10px;
        }

        .section-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .chart-card {
            margin-top: 24px;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .forecast-section {
            margin-top: 30px;
        }

        .section-title {
            color: white;
            text-align: center;
            font-size: 26px;
            margin-bottom: 18px;
            font-weight: 800;
        }

        .forecast-hours-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
        }

        .forecast-days-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
        }

        .forecast-card {
            background: rgba(255,255,255,0.97);
            padding: 16px;
            border-radius: 18px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            animation: fadeUp 0.35s ease;
        }

        .forecast-card h4 {
            font-size: 16px;
            color: var(--secondary);
            margin-bottom: 4px;
        }

        .forecast-time {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .forecast-card img {
            width: 68px;
            height: 68px;
        }

        .forecast-temp {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            margin: 8px 0 6px;
        }

        .forecast-desc {
            color: var(--muted);
            font-size: 14px;
            text-transform: capitalize;
            font-weight: 600;
        }

        .hourly-scroll-wrap {
            margin-top: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.35) transparent;
        }

        .hourly-scroll-wrap::-webkit-scrollbar {
            height: 8px;
        }

        .hourly-scroll-wrap::-webkit-scrollbar-track {
            background: transparent;
        }

        .hourly-scroll-wrap::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.28);
            border-radius: 999px;
        }

        .hourly-strip {
            display: flex;
            gap: 14px;
            min-width: max-content;
            padding: 4px 2px 6px 2px;
        }

        .hourly-card {
            width: 130px;
            min-width: 130px;
            background: rgba(255,255,255,0.97);
            border-radius: 22px;
            padding: 16px 14px;
            text-align: center;
            box-shadow: var(--shadow-soft);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: fadeUp 0.35s ease;
        }

        .hourly-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 28px rgba(15,23,42,0.14);
        }

        .hourly-top {
            font-size: 14px;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 4px;
        }

        .hourly-date {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hourly-card img {
            width: 70px;
            height: 70px;
        }

        .hourly-temp {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            margin: 6px 0 4px 0;
        }

        .hourly-desc {
            font-size: 13px;
            color: var(--muted);
            font-weight: 700;
            line-height: 1.35;
            text-transform: capitalize;
        }

        .day-card {
            position: relative;
            padding: 18px 16px;
            border-radius: 22px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            overflow: hidden;
            animation: fadeUp 0.35s ease;
        }

        .day-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 18px 32px rgba(15,23,42,0.18);
        }

        .day-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            background: #2563eb;
            color: white;
        }

        .day-card.sunny {
            background: linear-gradient(180deg, #fef3c7, #fde68a);
        }

        .day-card.cloudy {
            background: linear-gradient(180deg, #e2e8f0, #cbd5e1);
        }

        .day-card.rainy {
            background: linear-gradient(180deg, #dbeafe, #bfdbfe);
        }

        .day-card.storm {
            background: linear-gradient(180deg, #cbd5e1, #94a3b8);
        }

        .day-card.default {
            background: linear-gradient(180deg, #ffffff, #f8fafc);
        }

        .day-card img {
            width: 70px;
            height: 70px;
            margin: 6px 0;
        }

        .day-name {
            font-size: 15px;
            font-weight: 900;
            color: var(--secondary);
        }

        .day-date {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .temp-range {
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .temp-max {
            font-size: 22px;
            font-weight: 900;
            color: #dc2626;
        }

        .temp-min {
            font-size: 14px;
            color: var(--muted);
            font-weight: 700;
        }

        .weather-effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .sun-glow,
        .cloud-layer,
        .rain-layer,
        .mist-layer,
        .storm-flash {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .sun-glow {
            display: none;
            background:
                radial-gradient(circle at 80% 18%, rgba(255,255,255,0.60), rgba(255,255,255,0.10) 18%, transparent 26%);
            animation: pulseSun 5s ease-in-out infinite;
        }

        .cloud-layer {
            display: none;
        }

        .cloud-layer::before,
        .cloud-layer::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 90px;
            background: rgba(255,255,255,0.18);
            border-radius: 999px;
            filter: blur(2px);
            animation: moveClouds 18s linear infinite;
        }

        .cloud-layer::before {
            top: 80px;
            left: -280px;
        }

        .cloud-layer::after {
            top: 150px;
            left: -360px;
            animation-duration: 24s;
        }

        .rain-layer {
            display: none;
            background-image:
                linear-gradient(to bottom, rgba(255,255,255,0.0), rgba(255,255,255,0.55));
            background-size: 2px 22px;
            opacity: 0.22;
            animation: rainFall 0.45s linear infinite;
        }

        .mist-layer {
            display: none;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.18), rgba(255,255,255,0.08));
            filter: blur(10px);
            animation: mistMove 9s ease-in-out infinite;
        }

        .storm-flash {
            display: none;
            background: rgba(255,255,255,0.08);
            animation: stormFlash 4s infinite;
        }

        body.bg-sunny .sun-glow,
        body.bg-cloudy .cloud-layer,
        body.bg-rainy .rain-layer,
        body.bg-mist .mist-layer,
        body.bg-storm .storm-flash,
        body.bg-storm .cloud-layer,
        body.bg-storm .rain-layer {
            display: block;
        }

        .theme-night .panel,
        .theme-night .weather-card,
        .theme-night .table-card,
        .theme-night .stat-card,
        .theme-night .favorite-card,
        .theme-night .chart-card,
        .theme-night .forecast-card,
        .theme-night .hourly-card,
        .theme-night .day-card,
        .theme-night .mini-box {
            background: rgba(15, 23, 42, 0.92) !important;
            color: #e2e8f0;
            border-color: rgba(255,255,255,0.08);
        }

        .theme-night .weather-left h2,
        .theme-night .day-name,
        .theme-night .hourly-top,
        .theme-night .forecast-card h4,
        .theme-night .stat-card p,
        .theme-night .favorite-card h3,
        .theme-night .mini-box .value {
            color: #f8fafc !important;
        }

        .theme-night .forecast-desc,
        .theme-night .forecast-time,
        .theme-night .weather-note,
        .theme-night .mini-box .label,
        .theme-night .temp-min,
        .theme-night .day-date,
        .theme-night .hourly-date,
        .theme-night .hourly-desc {
            color: #cbd5e1 !important;
        }

        .theme-night table td {
            background: rgba(15, 23, 42, 0.92) !important;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .theme-night tbody tr:hover td {
            background: rgba(30, 41, 59, 0.96) !important;
        }

        .theme-night .badge-temp,
        .theme-night .meta-pill,
        .theme-night .city-chip {
            background: rgba(37,99,235,0.20) !important;
            color: #bfdbfe !important;
        }

        .theme-night .desc-chip {
            background: rgba(148,163,184,0.18) !important;
            color: #e2e8f0 !important;
        }

        .theme-toggle {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 1200;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            box-shadow: var(--shadow);
            background: rgba(255,255,255,0.92);
            color: #0f172a;
            transition: transform 0.25s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-3px) scale(1.04);
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-box {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 26px 30px;
            border-radius: 22px;
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
            min-width: 250px;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 5px solid rgba(255,255,255,0.28);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            margin: 0 auto 14px auto;
            animation: spin 1s linear infinite;
        }

        .loader-box p {
            font-weight: 700;
            font-size: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulseSun {
            0%, 100% { opacity: 0.75; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        @keyframes moveClouds {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 420px)); }
        }

        @keyframes rainFall {
            0% { background-position: 0 -22px; }
            100% { background-position: 0 22px; }
        }

        @keyframes mistMove {
            0%, 100% { transform: translateX(-2%); opacity: 0.45; }
            50% { transform: translateX(2%); opacity: 0.6; }
        }

        @keyframes stormFlash {
            0%, 92%, 100% { opacity: 0; }
            93% { opacity: 0.18; }
            94% { opacity: 0; }
            95% { opacity: 0.28; }
            96% { opacity: 0; }
        }

        @media (max-width: 1100px) {
            .forecast-hours-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .forecast-days-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .weather-card,
            .stats-grid,
            .favorite-grid {
                grid-template-columns: 1fr;
            }

            .mini-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .temp {
                font-size: 48px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 18px 20px;
                flex-direction: column;
                gap: 14px;
                text-align: center;
            }

            .brand {
                font-size: 22px;
            }

            .main-wrapper {
                margin: 24px auto;
            }

            .panel {
                padding: 22px;
            }

            .page-title {
                font-size: 30px;
            }

            .mini-grid,
            .forecast-hours-grid,
            .forecast-days-grid {
                grid-template-columns: 1fr;
            }

            .search-form input,
            .search-form select,
            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body class="{% if fondo_clima == 'sunny' %}bg-sunny{% elif fondo_clima == 'cloudy' %}bg-cloudy{% elif fondo_clima == 'rainy' %}bg-rainy{% elif fondo_clima == 'storm' %}bg-storm{% elif fondo_clima == 'mist' %}bg-mist{% else %}bg-default{% endif %}">
    <div class="weather-effects">
        <div class="sun-glow"></div>
        <div class="cloud-layer"></div>
        <div class="rain-layer"></div>
        <div class="mist-layer"></div>
        <div class="storm-flash"></div>
    </div>

    <div class="page-shell">
        <header class="navbar">
            <div class="brand">
                <div class="brand-icon">🌤</div>
                <div>Clima Paraguay</div>
            </div>

            <div class="nav-links">
                <a href="{% url 'inicio' %}">Inicio</a>
                <a href="{% url 'historial' %}">Historial</a>
                <a href="{% url 'favoritos' %}">Favoritos</a>
                <a href="{% url 'estadisticas' %}">Estadísticas</a>
            </div>
        </header>

        <div class="main-wrapper">
            <div class="panel">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <p>Consultando el clima...</p>
        </div>
    </div>

    <button type="button" class="theme-toggle" id="themeToggle" title="Cambiar tema">🌙</button>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const forms = document.querySelectorAll('form');

            forms.forEach(form => {
                form.addEventListener('submit', function () {
                    const loader = document.getElementById('loaderOverlay');
                    if (loader) {
                        loader.style.display = 'flex';
                    }
                });
            });

            const deleteLinks = document.querySelectorAll('.delete-link');
            deleteLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    if (!confirm('¿Seguro que deseas eliminar esta consulta?')) {
                        e.preventDefault();
                    }
                });
            });

            const clearLinks = document.querySelectorAll('.clear-link');
            clearLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    if (!confirm('¿Seguro que deseas vaciar todo el historial?')) {
                        e.preventDefault();
                    }
                });
            });

            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;
            const savedTheme = localStorage.getItem('weatherTheme');

            function applyNightTheme(active) {
                body.classList.toggle('theme-night', active);
                themeToggle.textContent = active ? '☀️' : '🌙';
            }

            if (savedTheme === 'night') {
                applyNightTheme(true);
            } else if (savedTheme === 'day') {
                applyNightTheme(false);
            } else {
                const hour = new Date().getHours();
                applyNightTheme(hour >= 19 || hour <= 6);
            }

            themeToggle.addEventListener('click', function () {
                const isNight = !body.classList.contains('theme-night');
                applyNightTheme(isNight);
                localStorage.setItem('weatherTheme', isNight ? 'night' : 'day');
            });
        });
    </script>
</body>
</html>
