<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clima Paraguay{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base:      #070b14;
            --bg-surface:   #0d1424;
            --bg-card:      #111827;
            --bg-elevated:  #1a2236;
            --bg-hover:     #1e2a40;
            --border:       rgba(255,255,255,0.07);
            --border-soft:  rgba(255,255,255,0.05);
            --border-bright:rgba(255,255,255,0.13);
            --text-primary: #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:   #4b5563;
            --accent:       #3b82f6;
            --accent-dark:  #2563eb;
            --accent-light: #60a5fa;
            --accent-glow:  rgba(59,130,246,0.20);
            --green:        #22c55e;
            --amber:        #f59e0b;
            --red:          #ef4444;
            --shadow:       0 24px 48px rgba(0,0,0,0.45);
            --shadow-soft:  0 8px 24px rgba(0,0,0,0.30);
            --radius:       20px;
            --radius-sm:    14px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
            background: var(--bg-base);
            overflow-x: hidden;
            transition: background 0.6s ease;
        }

        /* ── Weather backgrounds ── */
        .bg-sunny  { background: linear-gradient(145deg, #0f0a00, #1c1000, #2a1800); }
        .bg-cloudy { background: linear-gradient(145deg, #0a0d14, #0f1420, #141d2e); }
        .bg-rainy  { background: linear-gradient(145deg, #020810, #040e1a, #061528); }
        .bg-storm  { background: linear-gradient(145deg, #040407, #07070f, #0a0a18); }
        .bg-mist   { background: linear-gradient(145deg, #090d16, #0e1420, #14192a); }
        .bg-default{ background: linear-gradient(145deg, #070b14, #0a1020, #0d1528); }

        /* ── Ambient orbs ── */
        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            top: -150px; left: -150px;
            background: var(--accent);
        }
        body::after {
            width: 400px; height: 400px;
            bottom: -120px; right: -100px;
            background: #818cf8;
        }

        /* ── Weather FX ── */
        .weather-effects {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .sun-glow, .cloud-layer, .rain-layer, .mist-layer, .storm-flash {
            position: absolute; inset: 0; pointer-events: none;
        }
        .sun-glow {
            display: none;
            background: radial-gradient(circle at 78% 16%, rgba(251,191,36,0.18), transparent 30%);
            animation: pulseSun 6s ease-in-out infinite;
        }
        .cloud-layer { display: none; }
        .cloud-layer::before, .cloud-layer::after {
            content: "";
            position: absolute;
            width: 300px; height: 100px;
            background: rgba(255,255,255,0.04);
            border-radius: 999px;
            filter: blur(4px);
            animation: moveClouds 22s linear infinite;
        }
        .cloud-layer::before { top: 80px; left: -320px; }
        .cloud-layer::after  { top: 160px; left: -420px; animation-duration: 30s; }
        .rain-layer {
            display: none;
            background-image: linear-gradient(to bottom, transparent, rgba(255,255,255,0.35));
            background-size: 2px 20px;
            opacity: 0.12;
            animation: rainFall 0.4s linear infinite;
        }
        .mist-layer {
            display: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.07), rgba(255,255,255,0.03));
            filter: blur(14px);
            animation: mistMove 10s ease-in-out infinite;
        }
        .storm-flash {
            display: none;
            background: rgba(255,255,255,0.04);
            animation: stormFlash 5s infinite;
        }
        body.bg-sunny  .sun-glow,
        body.bg-cloudy .cloud-layer,
        body.bg-rainy  .rain-layer,
        body.bg-mist   .mist-layer,
        body.bg-storm  .storm-flash,
        body.bg-storm  .cloud-layer,
        body.bg-storm  .rain-layer { display: block; }

        /* ── Layout ── */
        .page-shell { position: relative; z-index: 1; }

        .navbar {
            width: 100%;
            padding: 0 40px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(7,11,20,0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
        }

        .brand-icon {
            width: 36px; height: 36px;
            display: grid; place-items: center;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-dark), var(--accent));
            font-size: 18px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .nav-links {
            display: flex; gap: 2px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.06);
        }

        .nav-links a.active {
            color: var(--accent-light);
            background: rgba(59,130,246,0.12);
        }

        .main-wrapper {
            max-width: 1160px;
            margin: 0 auto;
            padding: 36px 24px 60px;
        }

        /* ── Cards & Panels ── */
        .panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 32px;
            animation: fadeUp 0.4s ease;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        /* ── Typography ── */
        .page-title {
            color: var(--text-primary);
            font-size: 34px; font-weight: 800;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            text-align: center;
            font-size: 15px;
            margin: 0 auto 28px;
            max-width: 640px;
            line-height: 1.6;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 20px;
            border-radius: var(--radius-sm);
            border: none; cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700; font-size: 14px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
            border: 1px solid var(--border-bright);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.10);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239,68,68,0.15);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.25);
        }
        .btn-danger:hover {
            background: rgba(239,68,68,0.25);
        }

        /* ── Search form ── */
        .search-form {
            display: flex; justify-content: center;
            gap: 10px; flex-wrap: wrap;
        }

        .search-form input {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-bright);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px; font-weight: 500;
            width: 320px; max-width: 100%;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-form input::placeholder { color: var(--text-muted); }
        .search-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* ── Alerts ── */
        .alert-error, .alert-success {
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            margin: 16px auto;
            text-align: center;
            max-width: 680px;
            font-weight: 600; font-size: 14px;
            animation: fadeUp 0.3s ease;
        }
        .alert-error {
            background: rgba(239,68,68,0.12);
            color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.22);
        }
        .alert-success {
            background: rgba(34,197,94,0.12);
            color: #86efac;
            border: 1px solid rgba(34,197,94,0.22);
        }

        /* ── Weather card ── */
        .weather-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 28px;
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 24px;
            animation: fadeUp 0.4s ease;
        }

        .weather-left h2 {
            font-size: 22px; font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .temp {
            font-size: 72px; font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -3px;
            line-height: 1;
        }

        .desc {
            font-size: 16px; font-weight: 600;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .mini-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            transition: background 0.2s, border-color 0.2s;
        }
        .mini-box:hover {
            background: var(--bg-hover);
            border-color: var(--border-bright);
        }

        .mini-box .label {
            display: block;
            color: var(--text-muted);
            font-size: 11px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .mini-box .value {
            font-size: 17px; font-weight: 800;
            color: var(--text-primary);
        }

        .weather-right {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 12px;
        }

        .weather-right img {
            width: 140px; height: 140px;
            filter: drop-shadow(0 8px 24px rgba(59,130,246,0.25));
            animation: floatIcon 3.5s ease-in-out infinite;
        }

        .weather-note {
            color: var(--text-muted);
            font-size: 12px; font-weight: 600;
            text-align: center;
        }

        /* ── Table ── */
        .table-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: fadeUp 0.4s ease;
        }

        .table-responsive { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        table th {
            background: var(--bg-elevated);
            color: var(--text-muted);
            padding: 13px 16px;
            font-size: 11px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        table td {
            padding: 14px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-soft);
            color: var(--text-primary);
            font-size: 14px; font-weight: 500;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover td { background: var(--bg-elevated); }

        .badge-temp {
            display: inline-block;
            background: rgba(59,130,246,0.15);
            color: var(--accent-light);
            border: 1px solid rgba(59,130,246,0.20);
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: 700; font-size: 13px;
        }

        /* ── Small action buttons ── */
        .btn-small {
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 12px; font-weight: 700;
            display: inline-block;
            transition: all 0.2s ease;
            border: none; cursor: pointer;
        }
        .btn-small:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn-view   { background: rgba(59,130,246,0.25); color: #93c5fd; }
        .btn-fav    { background: rgba(245,158,11,0.22); color: #fcd34d; }
        .btn-delete { background: rgba(239,68,68,0.20); color: #fca5a5; }

        .actions { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }

        /* ── Stats grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            transition: border-color 0.2s, background 0.2s;
        }
        .stat-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-bright);
        }

        .stat-card h3 {
            font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--text-muted); margin-bottom: 12px;
        }

        .stat-card p {
            font-size: 36px; font-weight: 900;
            color: var(--text-primary); letter-spacing: -1px;
        }

        /* ── Favorites grid ── */
        .favorite-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .favorite-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px; text-align: center;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
            animation: fadeUp 0.35s ease;
        }
        .favorite-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-bright);
            transform: translateY(-3px);
        }

        .favorite-card h3 {
            font-size: 20px; font-weight: 800;
            color: var(--text-primary); margin-bottom: 8px;
        }
        .favorite-card .favorite-temp {
            font-size: 40px; font-weight: 900;
            color: var(--accent-light);
            letter-spacing: -2px;
            margin-bottom: 6px;
        }
        .favorite-card .favorite-desc {
            color: var(--text-secondary);
            font-size: 14px; font-weight: 600;
            text-transform: capitalize; margin-bottom: 14px;
        }

        /* ── Charts ── */
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 20px;
        }

        .chart-title {
            text-align: center;
            font-size: 17px; font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.2px;
        }

        /* ── Forecast ── */
        .forecast-section { margin-top: 28px; }

        .section-title {
            color: var(--text-primary);
            font-size: 18px; font-weight: 800;
            letter-spacing: -0.3px;
            margin-bottom: 14px;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 32px; height: 3px;
            border-radius: 999px;
            background: var(--accent);
            margin-top: 6px;
        }

        .hourly-scroll-wrap {
            overflow-x: auto; padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--border-bright) transparent;
        }
        .hourly-scroll-wrap::-webkit-scrollbar { height: 6px; }
        .hourly-scroll-wrap::-webkit-scrollbar-track { background: transparent; }
        .hourly-scroll-wrap::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 999px; }

        .hourly-strip {
            display: flex; gap: 10px;
            min-width: max-content;
            padding: 4px 2px 6px;
        }

        .hourly-card {
            width: 110px; min-width: 110px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 10px; text-align: center;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
            animation: fadeUp 0.35s ease;
        }
        .hourly-card:hover {
            background: var(--bg-elevated);
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .hourly-top { font-size: 13px; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
        .hourly-date { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        .hourly-card img { width: 56px; height: 56px; }
        .hourly-temp { font-size: 18px; font-weight: 900; color: var(--accent-light); margin: 6px 0 4px; }
        .hourly-desc { font-size: 11px; color: var(--text-secondary); font-weight: 600; text-transform: capitalize; line-height: 1.3; }

        .forecast-days-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .day-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px 12px; text-align: center;
            position: relative; overflow: hidden;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
            animation: fadeUp 0.35s ease;
        }
        .day-card:hover {
            background: var(--bg-elevated);
            border-color: var(--border-bright);
            transform: translateY(-4px);
        }

        .day-badge {
            position: absolute; top: 8px; right: 8px;
            font-size: 10px; font-weight: 800;
            padding: 3px 8px; border-radius: 999px;
            background: var(--accent); color: white;
            letter-spacing: 0.3px;
        }

        .day-card img { width: 60px; height: 60px; margin: 4px 0; }
        .day-name { font-size: 13px; font-weight: 900; color: var(--text-primary); }
        .day-date { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
        .temp-range { margin: 6px 0; }
        .temp-max { font-size: 20px; font-weight: 900; color: var(--text-primary); }
        .temp-min { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .forecast-desc { font-size: 11px; color: var(--text-secondary); text-transform: capitalize; font-weight: 600; margin-top: 4px; }

        /* ── Map card ── */
        .map-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-top: 24px;
            animation: fadeUp 0.4s ease;
        }
        .map-card-header {
            padding: 18px 22px 14px;
            font-size: 15px; font-weight: 800;
            color: var(--text-primary);
        }
        #mapa-ciudad { height: 340px; width: 100%; }

        /* ── Section actions ── */
        .section-actions {
            display: flex; justify-content: flex-end;
            gap: 10px; flex-wrap: wrap;
            margin-bottom: 16px;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px; font-weight: 600;
            padding: 48px 20px;
        }

        /* ── Theme toggle ── */
        .theme-toggle {
            position: fixed; right: 20px; bottom: 20px;
            z-index: 1200;
            width: 46px; height: 46px;
            border-radius: 50%; border: 1px solid var(--border-bright);
            cursor: pointer; font-size: 18px;
            background: var(--bg-elevated);
            color: var(--text-primary);
            transition: transform 0.2s, background 0.2s;
            box-shadow: var(--shadow-soft);
        }
        .theme-toggle:hover { transform: scale(1.08); background: var(--bg-hover); }

        /* ── Loader ── */
        .loader-overlay {
            position: fixed; inset: 0;
            background: rgba(7,11,20,0.70);
            backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .loader-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border-bright);
            padding: 28px 36px;
            border-radius: var(--radius);
            text-align: center; color: var(--text-primary);
            box-shadow: var(--shadow);
            min-width: 220px;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid var(--border-bright);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.9s linear infinite;
        }
        .loader-box p { font-weight: 700; font-size: 14px; color: var(--text-secondary); }

        /* ── Light theme override ── */
        body.theme-light {
            --bg-base:      #f8fafc;
            --bg-surface:   #f1f5f9;
            --bg-card:      #ffffff;
            --bg-elevated:  #f8fafc;
            --bg-hover:     #f1f5f9;
            --border:       rgba(0,0,0,0.08);
            --border-soft:  rgba(0,0,0,0.05);
            --border-bright:rgba(0,0,0,0.14);
            --text-primary: #0f172a;
            --text-secondary:#475569;
            --text-muted:   #94a3b8;
            color-scheme: light;
        }
        body.theme-light { background: var(--bg-base); }
        body.theme-light.bg-default { background: linear-gradient(145deg, #dbeafe, #eff6ff, #f0f9ff); }
        body.theme-light.bg-sunny   { background: linear-gradient(145deg, #fef3c7, #fde68a, #fcd34d); }
        body.theme-light.bg-rainy   { background: linear-gradient(145deg, #dbeafe, #bfdbfe, #93c5fd); }
        body.theme-light.bg-cloudy  { background: linear-gradient(145deg, #e2e8f0, #cbd5e1, #94a3b8); }
        body.theme-light.bg-storm   { background: linear-gradient(145deg, #cbd5e1, #94a3b8, #64748b); }
        body.theme-light .navbar { background: rgba(248,250,252,0.85); }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(12px); }
            to   { opacity:1; transform: translateY(0); }
        }
        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseSun {
            0%,100% { opacity:0.6; }
            50%      { opacity:1; }
        }
        @keyframes moveClouds {
            0%   { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 500px)); }
        }
        @keyframes rainFall {
            0%   { background-position: 0 -20px; }
            100% { background-position: 0 20px; }
        }
        @keyframes mistMove {
            0%,100% { transform: translateX(-2%); opacity:0.4; }
            50%     { transform: translateX(2%);  opacity:0.65; }
        }
        @keyframes stormFlash {
            0%,90%,100% { opacity:0; }
            91%  { opacity:0.12; }
            92%  { opacity:0; }
            93%  { opacity:0.20; }
            94%  { opacity:0; }
        }

        /* ── Responsive ── */
        @media (max-width: 1000px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .favorite-grid { grid-template-columns: repeat(2, 1fr); }
            .forecast-days-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .navbar { padding: 0 20px; flex-direction: column; height: auto; padding: 14px 20px; gap: 12px; }
            .main-wrapper { padding: 24px 16px 48px; }
            .panel { padding: 20px; }
            .weather-card { grid-template-columns: 1fr; }
            .weather-right { flex-direction: row; justify-content: flex-start; }
            .mini-grid { grid-template-columns: repeat(2, 1fr); }
            .stats-grid, .favorite-grid { grid-template-columns: 1fr; }
            .forecast-days-grid { grid-template-columns: repeat(2, 1fr); }
            .temp { font-size: 56px; }
            .search-form input { width: 100%; }
        }
    </style>
</head>

<body class="{% if fondo_clima == 'sunny' %}bg-sunny{% elif fondo_clima == 'cloudy' %}bg-cloudy{% elif fondo_clima == 'rainy' %}bg-rainy{% elif fondo_clima == 'storm' %}bg-storm{% elif fondo_clima == 'mist' %}bg-mist{% else %}bg-default{% endif %}">

    <div class="weather-effects">
        <div class="sun-glow"></div>
        <div class="cloud-layer"></div>
        <div class="rain-layer"></div>
        <div class="mist-layer"></div>
        <div class="storm-flash"></div>
    </div>

    <div class="page-shell">
        <header class="navbar">
            <a href="{% url 'inicio' %}" class="brand">
                <div class="brand-icon">🌤</div>
                Clima Paraguay
            </a>
            <nav class="nav-links">
                <a href="{% url 'inicio' %}"       {% if request.resolver_match.url_name == 'inicio' %}class="active"{% endif %}>Inicio</a>
                <a href="{% url 'historial' %}"    {% if request.resolver_match.url_name == 'historial' %}class="active"{% endif %}>Historial</a>
                <a href="{% url 'favoritos' %}"    {% if request.resolver_match.url_name == 'favoritos' %}class="active"{% endif %}>Favoritos</a>
                <a href="{% url 'estadisticas' %}" {% if request.resolver_match.url_name == 'estadisticas' %}class="active"{% endif %}>Estadísticas</a>
                <a href="{% url 'comparar' %}"     {% if request.resolver_match.url_name == 'comparar' %}class="active"{% endif %}>Comparar</a>
            </nav>
        </header>

        <div class="main-wrapper">
            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <p>Consultando el clima...</p>
        </div>
    </div>

    <button type="button" class="theme-toggle" id="themeToggle" title="Cambiar tema">☀️</button>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', () => {
                    const loader = document.getElementById('loaderOverlay');
                    if (loader) loader.style.display = 'flex';
                });
            });

            document.querySelectorAll('.delete-link').forEach(link => {
                link.addEventListener('click', e => {
                    if (!confirm('¿Seguro que deseas eliminar esta consulta?')) e.preventDefault();
                });
            });

            document.querySelectorAll('.clear-link').forEach(link => {
                link.addEventListener('click', e => {
                    if (!confirm('¿Seguro que deseas vaciar todo el historial?')) e.preventDefault();
                });
            });

            const toggle = document.getElementById('themeToggle');
            const body = document.body;
            const saved = localStorage.getItem('weatherTheme');

            function applyTheme(light) {
                body.classList.toggle('theme-light', light);
                toggle.textContent = light ? '🌙' : '☀️';
            }

            applyTheme(saved === 'light');

            toggle.addEventListener('click', () => {
                const isLight = !body.classList.contains('theme-light');
                applyTheme(isLight);
                localStorage.setItem('weatherTheme', isLight ? 'light' : 'dark');
            });
        });
    </script>
</body>
</html>
